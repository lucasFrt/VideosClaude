# Narração (e, se pedido, a prévia) rodando nos servidores do GitHub, que têm a internet que a
# voz oficial precisa (o edge-tts usa WebSocket). Dá para disparar pelo celular: no app ou no
# site do GitHub, Actions → "Narração e prévia" → Run workflow.
#
# Devolve ao repositório a narração (narracao.mp3, palavras.json, texto.txt) e a composição
# remontada; a prévia, quando pedida, fica nos "Artifacts" da execução.
name: Narração e prévia

on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do vídeo (ex.: videos/2026-10-24-fim-das-tarifas-de-importacao)"
        required: true
      renderizar:
        description: "Renderizar a prévia também (leva alguns minutos)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PASTA: ${{ inputs.pasta }}
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_SKIP_SKILLS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a pasta
        run: |
          [[ "$PASTA" =~ ^videos/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]] || { echo "Pasta inválida: $PASTA"; exit 1; }
          [ -f "$PASTA/03-roteiro.toml" ] || { echo "Não encontrei $PASTA/03-roteiro.toml"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar HyperFrames e edge-tts (versões fixas)
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --quiet -r requirements.txt

      - name: Narração e composição
        if: ${{ !inputs.renderizar }}
        run: |
          python scripts/roteiro.py texto "$PASTA"
          python scripts/narrar.py "$PASTA"
          python scripts/montar.py "$PASTA"
          ./scripts/ajustar-volume.sh "$PASTA"

      - name: Narração, composição e prévia
        if: ${{ inputs.renderizar }}
        run: |
          node_modules/.bin/hyperframes browser ensure >/dev/null
          ./scripts/previa.sh "$PASTA"

      - name: Devolver a narração ao repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$PASTA"
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Narração de $PASTA (gerada no GitHub Actions)"
            # Se alguém empurrou algo para o ramo durante a execução, põe a narração por cima.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Guardar a prévia
        if: ${{ inputs.renderizar }}
        uses: actions/upload-artifact@v4
        with:
          name: previa
          path: ${{ inputs.pasta }}/previa.mp4
          retention-days: 14
