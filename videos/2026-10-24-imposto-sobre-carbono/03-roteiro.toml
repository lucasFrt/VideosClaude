# Roteiro: a fonte da verdade do vídeo. O 03-roteiro.md é gerado pelo scripts/roteiro.py.
# Versão 1 (onda 2). Todas as fontes conferidas por busca em 2026-10-24 (ver o 02-fontes.md).

titulo = "E se o Brasil cobrasse um imposto sobre carbono?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com uma bomba de combustível low-poly cujo visor marca '+R$ 0,30 por litro? (cenário)' em amarelo; o Zé, surpreso, segura a mangueira; do escapamento de um carro sai uma nuvem cinza de cubos."

  [[bloco.frase]]
  fala = "Gasolina: uns 30 centavos a mais por litro."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F3"]
  tela = "+R$ 0,30 por litro? (cenário)"
  voz = "Gasolina: uns trinta centavos a mais por litro."

  [[bloco.frase]]
  fala = "E se o carbono pagasse imposto? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma fábrica low-poly ganha uma tampa com a etiqueta 'limite'; depois, colunas de blocos 3D das emissões: desmatamento e agropecuária juntos (amarelo, quase 70%) ao lado de uma coluna menor de energia (branca); o Zé olha de baixo."

  [[bloco.frase]]
  fala = "Hoje, o Brasil não tem esse imposto, só uma lei recente que vai limitar quem mais polui."
  marcacao = "FATO"
  fontes = ["F7", "F8"]

  [[bloco.frase]]
  fala = "E quase 70% das nossas emissões vêm do desmatamento e da agropecuária."
  marcacao = "FATO"
  fontes = ["F4", "F5"]
  tela = "Quase 70% das emissões brutas: desmatamento + agropecuária"
  voz = "E quase setenta por cento das nossas emissões vêm do desmatamento e da agropecuária."

[[bloco]]
nome = "O que mudaria"
cena = "Etiqueta 'R$ 200 por tonelada (suposição)' sobre a nuvem de cubos; moedas iguais voltam para várias casinhas iguais; contadores na bomba (gasolina e diesel); o Zé troca a mangueira pela de etanol e sorri; um caminhão passa e a etiqueta de preço numa caixa sobe um pouco; por fim, árvores e gado ficam do lado de fora de um cercado onde estão a bomba e a fábrica."

  [[bloco.frase]]
  fala = "Aqui, vamos supor R$ 200 por tonelada de gás carbônico dos combustíveis fósseis, com o dinheiro devolvido igualmente a cada pessoa."
  marcacao = "PREMISSA"
  voz = "Aqui, vamos supor duzentos reais por tonelada de gás carbônico dos combustíveis fósseis, com o dinheiro devolvido igualmente a cada pessoa."

  [[bloco.frase]]
  fala = "Seriam uns 30 centavos a mais no litro da gasolina e uns 45 no diesel."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F2", "F3"]
  tela = "Cenário de R$ 200/t: gasolina +R$ 0,30/l · diesel +R$ 0,45/l"
  voz = "Seriam uns trinta centavos a mais no litro da gasolina e uns quarenta e cinco no diesel."

  [[bloco.frase]]
  fala = "O etanol e os carros econômicos ganhariam vantagem, e o frete mais caro pesaria um pouco nos preços."
  marcacao = "PROJEÇÃO"
  fontes = ["F2", "F3"]

  [[bloco.frase]]
  fala = "Como esse imposto não pega o desmatamento nem a agropecuária, o corte no total teria limite."
  marcacao = "PROJEÇÃO"
  fontes = ["F4"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; o verde acende com o Zé recebendo um envelope de moedas; o coral acende com um carro numa estrada longa, um caminhão e uma fábrica com chaminé; no termômetro, os dois apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que cada um cortaria emissões do jeito mais barato e que, com a devolução, os mais pobres sairiam ganhando, em média."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F9", "F10", "F16", "F18", "F20"]

  [[bloco.frase]]
  fala = "Quem critica aponta que, mesmo com a devolução, perderia quem depende muito do carro ou do frete, inclusive parte dos mais pobres, e a indústria pesada."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F18", "F26", "F23", "F22"]

  [[bloco.frase]]
  fala = "Entre os economistas, há amplo consenso de que cobrar pelo carbono é o jeito mais barato de cortar emissões. Já o tamanho do corte varia muito entre países."
  marcacao = "TERMÔMETRO"
  fontes = ["F9", "F10", "F24", "F11", "F12"]

# Exemplo real cortado na versão 1 para ficar perto de 75 s (CLAUDE.md, seção 3). As fontes da
# Suécia, da França e do Canadá estão conferidas no 02-fontes (F13 a F17). Se voltar,
# a ideia é uma frase só: a Suécia cobra desde 1991; a França cancelou a alta em 2018 depois dos
# protestos; o Canadá zerou a cobrança na bomba em 2025, mesmo devolvendo o dinheiro.

