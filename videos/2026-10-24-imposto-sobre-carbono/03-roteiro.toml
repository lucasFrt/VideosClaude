# Roteiro: a fonte da verdade do vídeo. O 03-roteiro.md é gerado pelo scripts/roteiro.py.
# Versão 3 (onda 4, rodada 2): mudanças registradas no 04-revisoes.md. Fontes conferidas por
# busca em 2026-10-24 (ver o 02-fontes.md).

titulo = "E se o Brasil cobrasse um imposto sobre carbono?"
versao = 3

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com uma bomba de combustível low-poly cujo visor marca '+R$ 0,33 por litro? (cenário)' em amarelo; o Zé, surpreso, segura a mangueira; do escapamento de um carro sai uma nuvem cinza de cubos."

  [[bloco.frase]]
  fala = "Gasolina: seriam uns 33 centavos a mais por litro."
  marcacao = "PROJEÇÃO"
  fontes = ["F29"]
  tela = "+R$ 0,33 por litro? (cenário)"
  voz = "Gasolina: seriam uns trinta e três centavos a mais por litro."

  [[bloco.frase]]
  fala = "E se o Brasil cobrasse um imposto sobre carbono? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma fábrica low-poly ganha uma tampa com a etiqueta 'limite'; depois, colunas de blocos 3D das emissões: desmatamento e agropecuária juntos (amarelo, quase 70%) ao lado de uma coluna menor de energia (branca); o Zé olha de baixo."

  [[bloco.frase]]
  fala = "Hoje, o Brasil não tem esse imposto, só uma lei recente que vai limitar quem mais polui."
  marcacao = "FATO"
  fontes = ["F7", "F8"]

  [[bloco.frase]]
  fala = "E quase 70% das nossas emissões vêm do desmatamento e da agropecuária."
  marcacao = "FATO"
  fontes = ["F4", "F5"]
  tela = "Quase 70% das emissões brutas: desmatamento + agropecuária"
  voz = "E quase setenta por cento das nossas emissões vêm do desmatamento e da agropecuária."

[[bloco]]
nome = "O que mudaria"
cena = "Etiqueta 'R$ 200 por tonelada (suposição)' sobre a nuvem de cubos; contadores na bomba (gasolina e diesel); moedas iguais voltam para várias casinhas iguais, com o contador da devolução; o Zé troca a mangueira pela de etanol e sorri; um caminhão passa e a etiqueta de preço numa caixa sobe um pouco; por fim, um cercado: dentro, a bomba, a fábrica e um trator; fora, árvores derrubadas, um boi e um pedaço de lavoura."

  [[bloco.frase]]
  fala = "Aqui, vamos supor R$ 200 por tonelada de gás carbônico dos combustíveis fósseis, com tudo devolvido igualmente às pessoas."
  marcacao = "PREMISSA"
  voz = "Aqui, vamos supor duzentos reais por tonelada de gás carbônico dos combustíveis fósseis, com tudo devolvido igualmente às pessoas."

  [[bloco.frase]]
  fala = "Repassado inteiro, daria aqueles 33 centavos na gasolina e uns 46 no diesel."
  marcacao = "PROJEÇÃO"
  fontes = ["F29"]
  tela = "Cenário de R$ 200/t: gasolina +R$ 0,33/l · diesel +R$ 0,46/l"
  voz = "Repassado inteiro, daria aqueles trinta e três centavos na gasolina e uns quarenta e seis no diesel."

  [[bloco.frase]]
  fala = "Já a devolução começaria em uns R$ 400 por pessoa por ano."
  marcacao = "PROJEÇÃO"
  fontes = ["F31"]
  tela = "Devolução: cerca de R$ 400 por pessoa por ano (ordem de grandeza)"
  voz = "Já a devolução começaria em uns quatrocentos reais por pessoa por ano."

  [[bloco.frase]]
  fala = "O etanol e os carros econômicos ganhariam vantagem, e o frete encareceria um pouco as coisas."
  marcacao = "PROJEÇÃO"
  fontes = ["F2", "F3"]

  [[bloco.frase]]
  fala = "Mas, sem alcançar o desmatamento nem as emissões do gado e do solo, o corte teria limite."
  marcacao = "PROJEÇÃO"
  fontes = ["F4"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; o verde acende com o Zé recebendo um envelope de moedas; o coral acende com um carro numa estrada longa, um caminhão e uma fábrica com chaminé; no termômetro, os dois apagam, o texto do consenso aparece acima da balança, com o rodapé de fonte, e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que cada um cortaria emissões do jeito mais barato e que, com a devolução, os mais pobres tenderiam a ganhar, segundo estudos."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F9", "F10", "F32", "F16", "F18", "F20"]

  [[bloco.frase]]
  fala = "Quem critica aponta que, mesmo com a devolução, perderia quem depende muito do carro ou do frete, inclusive parte dos mais pobres, e a indústria pesada."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F18", "F26", "F23"]

  [[bloco.frase]]
  fala = "Entre economistas, há amplo consenso, medido sobretudo nos Estados Unidos, de que cobrar pelo carbono corta emissões mais barato que impor regras. Já o tamanho do corte varia muito entre estudos."
  marcacao = "TERMÔMETRO"
  fontes = ["F9", "F10", "F27", "F24", "F11", "F12"]
  tela = "Amplo consenso, medido sobretudo nos EUA: cobrar pelo carbono corta emissões mais barato que regras"
  rodape = ["F10", "F9", "F24"]

