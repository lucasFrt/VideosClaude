# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
#
# Versão 1: ondas 1 e 2. Ainda não passou pelo crítico.
# Atenção: o limite de 21 milhões de bitcoins e a inflação do real desde 1994 ficaram fora do
# argumento a favor por falta de confirmação (limite de buscas esgotado); ver 02-fontes.md.

titulo = "E se o Brasil adotasse o Bitcoin como moeda?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o contador '4,67 milhões' enorme sobre uma nuvem de celulares low-poly; o Zé, surpreso, segura um celular onde gira uma moeda dourada genérica (sem o logotipo oficial do Bitcoin). Na pergunta, a moeda dourada pousa no balcão ao lado de uma moeda de real."

  [[bloco.frase]]
  fala = "Quase 5 milhões de brasileiros usaram criptomoedas num só mês."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "4,67 milhões em um mês (jun. 2026)"
  voz = "Quase cinco milhões de brasileiros usaram criptomoedas num só mês."

  [[bloco.frase]]
  fala = "E se o Brasil adotasse o Bitcoin como moeda? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Balcão da padaria do Zé: etiqueta do pão em R$ e uma plaquinha 'Bitcoin: bem digital'; na premissa, a plaquinha vira 'Obrigatório aceitar' e a moeda dourada entra no caixa ao lado das moedas de real, com uma etiqueta 'como em El Salvador, 2021'."

  [[bloco.frase]]
  fala = "Hoje, o Bitcoin é legal aqui, mas como um bem digital, não como moeda."
  marcacao = "FATO"
  fontes = ["F3"]

  [[bloco.frase]]
  fala = "Aqui, vamos supor uma lei como a de El Salvador em 2021: o Bitcoin vira moeda ao lado do real, e toda loja tem que aceitar."
  marcacao = "PREMISSA"
  voz = "Aqui, vamos supor uma lei como a de El Salvador em dois mil e vinte e um: o Bitcoin vira moeda ao lado do real, e toda loja tem que aceitar."

[[bloco]]
nome = "O que mudaria"
cena = "O Zé paga o pão pelo celular e a maquininha aceita a moeda dourada, mas a etiqueta continua em R$; cartão '9 em cada 10 não usaram (El Salvador, 2024)' sobre um mapa simplificado sem bandeira, e a plaquinha 'Obrigatório' de lá vira 'Opcional'; por fim, uma alavanca de juros num painel genérico 'Banco Central' fica mais leve à medida que moedas douradas substituem as de real, e o Zé fica preocupado."

  [[bloco.frase]]
  fala = "No curto prazo, talvez pouca coisa mudasse: em El Salvador, que usa o dólar, mais de 9 em cada 10 pessoas não usaram Bitcoin em 2024."
  marcacao = "PROJEÇÃO"
  fontes = ["F8", "F10", "F6"]
  tela = "9 em cada 10 não usaram (El Salvador, 2024)"
  voz = "No curto prazo, talvez pouca coisa mudasse: em El Salvador, que usa o dólar, mais de nove em cada dez pessoas não usaram Bitcoin em dois mil e vinte e quatro."

  [[bloco.frase]]
  fala = "Depois, a obrigação de aceitar caiu por lá."
  marcacao = "FATO"
  fontes = ["F7"]

  [[bloco.frase]]
  fala = "No longo prazo, ninguém sabe quantos trocariam de moeda; se fossem muitos, o Banco Central perderia força contra a inflação."
  marcacao = "PROJEÇÃO"
  fontes = ["F11"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: no prato verde, um cadeado sobre uma pilha de moedas douradas, sem nenhum prédio de governo por perto; no prato coral, um gráfico de linha que despenca '−64%' e dispara '+155%'; cada prato acende na sua frase; no termômetro, os dois apagam, aparece o cartão 'FMI: não dar status de moeda oficial' e a balança termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que nenhum governo ou banco central controla o Bitcoin, então ninguém pode desvalorizá-lo emitindo mais, e isso protegeria a poupança da inflação."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F4", "F20", "F21"]

  [[bloco.frase]]
  fala = "Quem critica aponta que salário e aluguel pedem preço estável, e o Bitcoin perdeu quase dois terços do valor num ano e, no seguinte, mais que dobrou."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F14"]
  tela = "−64% em 2022 · +155% em 2023"

  [[bloco.frase]]
  fala = "O FMI recomenda que nenhum país dê ao Bitcoin papel de moeda oficial, e a maioria dos economistas consultados vê utilidade limitada nele como dinheiro. Como investimento, há mais incerteza."
  marcacao = "TERMÔMETRO"
  fontes = ["F11", "F17", "F18"]
  voz = "O efe eme i recomenda que nenhum país dê ao Bitcoin papel de moeda oficial, e a maioria dos economistas consultados vê utilidade limitada nele como dinheiro. Como investimento, há mais incerteza."

# Exemplo real: El Salvador entrou no bloco "O que mudaria" (é a única evidência direta do cenário),
# com a diferença principal (lá se usa o dólar) e o recuo de 2025. Um bloco próprio passaria de
# 80 s; a República Centro-Africana (F13) e o estado atual do acordo com o FMI (F12) ficam no
# 01-ideia e no 02-fontes.

[[bloco]]
nome = "Encerramento"
cena = "Zé de frente para a câmera, com uma moeda de real numa mão e a moeda dourada na outra, ombros levantados, esperando a resposta."

  [[bloco.frase]]
  fala = "E aí, você toparia? Me conta nos comentários."
  marcacao = "BORDÃO"
