titulo = "E se o Brasil adotasse o Bitcoin como moeda?"
versao = 4

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o contador '4,67 milhões' enorme sobre uma nuvem de celulares low-poly; o Zé, surpreso, segura um celular onde gira uma moeda dourada genérica (sem o logotipo oficial do Bitcoin). Na pergunta, a moeda dourada pousa no balcão ao lado de uma moeda de real."

  [[bloco.frase]]
  fala = "4,6 milhões de brasileiros negociaram criptomoedas num só mês."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "4,67 milhões em um mês (jun. 2026)"
  voz = "Quatro vírgula seis milhões de brasileiros negociaram criptomoedas num só mês."

  [[bloco.frase]]
  fala = "E se o Brasil adotasse o Bitcoin como moeda? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Balcão da padaria do Zé: etiqueta do pão em R$ e uma plaquinha 'Bitcoin: ativo virtual, não moeda'; na premissa, a plaquinha vira 'Obrigatório aceitar' e a moeda dourada entra no caixa ao lado das moedas de real, com uma etiqueta 'como em El Salvador, 2021'."

  [[bloco.frase]]
  fala = "Hoje, ele é permitido aqui como ativo virtual, não como moeda."
  marcacao = "FATO"
  fontes = ["F3"]

  [[bloco.frase]]
  fala = "Aqui, vamos supor uma lei como a de El Salvador em 2021: o Bitcoin vira moeda ao lado do real, e toda loja tem que aceitar."
  marcacao = "PREMISSA"
  voz = "Aqui, vamos supor uma lei como a de El Salvador em dois mil e vinte e um: o Bitcoin vira moeda ao lado do real, e toda loja tem que aceitar."

[[bloco]]
nome = "O que mudaria"
cena = "O Zé paga o pão pelo celular e a maquininha aceita a moeda dourada, mas a etiqueta continua em R$; cartão '9 em cada 10 não usaram (El Salvador, 2024)' sobre um mapa simplificado sem bandeira, com a nota pequena 'obrigação em vigor até jan./2025; depois, voluntária (acordo com o FMI)'; ao lado, duas etiquetas de inflação de 2025, a do dólar menor que a do real; por fim, tracejada e com um 'e se...?', uma alavanca de juros num painel genérico 'Banco Central' fica mais leve à medida que moedas douradas substituem as de real, e o Zé fica preocupado."

  [[bloco.frase]]
  fala = "No curto prazo, talvez pouco mudasse: em El Salvador, mais de 9 em cada 10 pessoas não usaram Bitcoin em 2024."
  marcacao = "PROJEÇÃO"
  fontes = ["F8", "F10", "F7"]
  tela = "9 em cada 10 não usaram (El Salvador, 2024) · obrigação em vigor até jan./2025; depois, voluntária (acordo com o FMI)"
  voz = "No curto prazo, talvez pouco mudasse: em El Salvador, mais de nove em cada dez pessoas não usaram Bitcoin em dois mil e vinte e quatro."

  [[bloco.frase]]
  fala = "Mas lá se usa o dólar, de inflação menor que a do real."
  marcacao = "FATO"
  fontes = ["F24", "F6"]
  tela = "Inflação em 2025: EUA 2,7% · Brasil 4,26%"
  rodape = ["F24"]

  [[bloco.frase]]
  fala = "No longo prazo, se muitos trocassem de moeda, os juros do Banco Central perderiam força contra a inflação."
  marcacao = "PROJEÇÃO"
  fontes = ["F11"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: no prato verde, um cadeado sobre uma pilha de moedas douradas com '21 milhões (teto)' e, ao lado, uma nota de real que encolhe; no prato coral, um gráfico de linha que despenca '−64%' e dispara '+155%'; cada prato acende na sua frase; no termômetro, os dois apagam, aparecem os cartões 'FMI, 2023: não dar status de moeda oficial' e 'Economistas dos EUA, 2013: utilidade limitada', e a balança termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que ninguém emite além de 21 milhões de bitcoins, e o real perdeu mais de 85% do poder de compra desde o Plano Real."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F22", "F23"]
  tela = "21 milhões (teto) · real: −85% desde 1994"
  voz = "Quem defende aponta que ninguém emite além de vinte e um milhões de bitcoins, e o real perdeu mais de oitenta e cinco por cento do poder de compra desde o Plano Real."

  [[bloco.frase]]
  fala = "Quem critica aponta que salário e aluguel pedem preço estável, e o Bitcoin caiu quase dois terços do valor num ano e, no seguinte, mais que dobrou."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F14"]
  tela = "−64% em 2022 · +155% em 2023"

  [[bloco.frase]]
  fala = "O FMI recomenda que nenhum país faça do Bitcoin moeda oficial, e na única pesquisa com economistas sobre o Bitcoin como dinheiro que achamos, de 2013, a maioria viu utilidade limitada nele."
