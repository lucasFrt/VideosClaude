  fontes = ["F11", "F17"]
  tela = "FMI, 2023 · economistas dos EUA, 2013"
  voz = "O efe eme i recomenda que nenhum país faça do Bitcoin moeda oficial, e na única pesquisa com economistas sobre o Bitcoin como dinheiro que achamos, de dois mil e treze, a maioria viu utilidade limitada nele."

# Exemplo real: El Salvador está no bloco "O que mudaria" (uso em 2024 e a diferença do dólar).
