# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
#
# Cidade-modelo: São Paulo (01-ideia.md). Cenário: o rodízio de placas vira uma cobrança
# de R$ 10 por dia, na mesma área (centro expandido) e no mesmo horário.
# Versão 2: respostas à rodada 1 do crítico (04-revisoes.md).

titulo = "E se São Paulo cobrasse pedágio para entrar de carro no centro?"
versao = 2

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro: o Zé ao volante de um carro low-poly, parado numa fila de carros iguais; um contador grande sobe até '132 h' e vira '5 dias' sobre um calendário com cinco dias riscados. Câmera recua devagar até mostrar a fila inteira."

  [[bloco.frase]]
  fala = "Cinco dias por ano perdidos no trânsito."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "132 horas por ano perdidas no pico"

  [[bloco.frase]]
  fala = "E se São Paulo cobrasse pedágio no centro? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Um trajeto de 10 km desenhado sobre o mapa, com setas de ida e volta e o texto '10 km, ida e volta, no pico'. Depois, mapa low-poly simples, sem marcas reais: um anel de avenidas com o rótulo 'centro expandido'. Placas de carro com finais 1 e 2 apagam (rodízio). Na premissa, as placas viram uma etiqueta amarela 'R$ 10 por dia' com o selo 'suposição: mesma área e horário do rodízio'."

  [[bloco.frase]]
  fala = "É o tempo extra de quem faz dez quilômetros no pico, ida e volta, todo dia útil."
  marcacao = "FATO"
  fontes = ["F1"]

  [[bloco.frase]]
  fala = "Há quase trinta anos, o centro expandido tem rodízio de placas."
  marcacao = "FATO"
  fontes = ["F2"]
  tela = "Rodízio desde 1997"

  [[bloco.frase]]
  fala = "Aqui, vamos supor que o rodízio vira uma cobrança de dez reais por dia, e que a Justiça aceita."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "O Zé na entrada do anel, em dúvida: parte dos carros da fila vira ícones de ônibus e de metrô, ou um relógio adiantado. Ao mesmo tempo, carros com placa final 1 e 2 voltam a entrar, pagando; sobre a fila, um placar 'saem × entram' com um ponto de interrogação. Depois, moedas saem de uma câmera de placa e caem num cofre, que se abre em ônibus e numa ciclovia; uma ampulheta marca o longo prazo."

  [[bloco.frase]]
  fala = "No curto prazo, parte dos motoristas trocaria o carro por ônibus, metrô ou outro horário."
  marcacao = "PROJEÇÃO"
  fontes = ["F11", "F12", "F9", "F5"]

  [[bloco.frase]]
  fala = "Se a cobrança tirasse mais carros do que o rodízio, o trânsito melhoraria; ninguém sabe ao certo se tiraria."
  marcacao = "PROJEÇÃO"
  fontes = ["F2", "F11", "F12"]

  [[bloco.frase]]
  fala = "A lei federal de mobilidade prevê esse tipo de cobrança, com o dinheiro indo para o transporte público."
  marcacao = "FATO"
  fontes = ["F3"]

  [[bloco.frase]]
  fala = "No longo prazo, isso poderia virar mais ônibus e ciclovias, se a cidade gastasse bem."
  marcacao = "PROJEÇÃO"
  fontes = ["F3", "F5"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita. Na frase a favor, o prato verde acende com um velocímetro marcando '+11%' sobre um mapa genérico com o rótulo 'Nova York', um selo 'estudo preliminar' e uma vitrine de loja acesa. Na frase contra, o prato coral acende com o Zé olhando a carteira aberta e um ponto de ônibus ao fundo. No termômetro, os dois apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que, em Nova York, o trânsito no centro ficou cerca de 11% mais rápido, segundo um estudo preliminar, com pouco efeito no comércio."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F4"]
  tela = "+11% de velocidade (estudo preliminar)"
  voz = "Quem defende aponta que, em Nova York, o trânsito no centro ficou cerca de onze por cento mais rápido, segundo um estudo preliminar, com pouco efeito no comércio."

  [[bloco.frase]]
  fala = "Quem critica aponta que cerca de duzentos reais por mês pesam mais para quem ganha menos e precisa do carro, e que o transporte coletivo daqui perdeu passageiros."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F14"]
  tela = "Transporte coletivo: cerca de 20% menos viagens (2017–2023)"

  [[bloco.frase]]
  fala = "Entre os economistas, há quase consenso de que cobrar reduz o congestionamento; a divisão é sobre o preço, o destino do dinheiro e como compensar quem perde."
  marcacao = "TERMÔMETRO"
  fontes = ["F6", "F8"]
  tela = "Quase consenso: reduz o congestionamento. Divisão: preço, dinheiro e quem perde"

