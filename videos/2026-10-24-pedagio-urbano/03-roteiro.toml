  [[bloco.frase]]
  fala = "Quem defende aponta que, em Nova York, o trânsito no centro ficou cerca de 11% mais rápido nos primeiros meses, com pouco efeito no comércio."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F4"]
  tela = "+11% de velocidade (primeiros meses)"
