# Cidade-modelo: São Paulo (01-ideia.md). Cenário: o rodízio de placas vira uma cobrança
# de R$ 10 por dia, na mesma área (centro expandido) e no mesmo horário.

titulo = "E se São Paulo cobrasse pedágio para entrar de carro no centro?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro: o Zé ao volante de um carro low-poly, parado numa fila de carros iguais; um contador grande sobe até '132 h' e vira '5 dias' sobre um calendário com cinco dias riscados. Câmera recua devagar até mostrar a fila inteira."

  [[bloco.frase]]
  fala = "Cinco dias por ano no trânsito."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "132 horas por ano perdidas no pico"

  [[bloco.frase]]
  fala = "E se São Paulo cobrasse pedágio no centro? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Mapa low-poly simples, sem marcas reais: um anel de avenidas com o rótulo 'centro expandido'. Placas de carro com finais 1 e 2 apagam (rodízio). Na premissa, as placas viram uma etiqueta amarela 'R$ 10 por dia' com o selo 'suposição'."

  [[bloco.frase]]
  fala = "É o que perde quem dirige todo dia no pico em São Paulo."
  marcacao = "FATO"
  fontes = ["F1"]

  [[bloco.frase]]
  fala = "Há quase trinta anos, o centro expandido tem rodízio de placas."
  marcacao = "FATO"
  fontes = ["F2"]
  tela = "Rodízio desde 1997"

  [[bloco.frase]]
  fala = "Aqui, vamos supor que o rodízio vira uma cobrança de dez reais por dia, na mesma área e horário."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "O Zé na entrada do anel, em dúvida: parte dos carros da fila vira ícones de ônibus e de metrô, ou um relógio adiantado; os carros que ficam andam mais rápido (setas verdes), e um ônibus passa junto. Depois, moedas saem de uma câmera de placa e caem num cofre, que se abre em ônibus e numa ciclovia; uma ampulheta marca o longo prazo."

  [[bloco.frase]]
  fala = "No curto prazo, parte dos motoristas trocaria o carro por ônibus, metrô ou outro horário; quantos, ninguém sabe."
