  fontes = ["F3"]

  [[bloco.frase]]
  fala = "No longo prazo, isso poderia virar mais ônibus e ciclovias, se a cidade gastasse bem."
  marcacao = "PROJEÇÃO"
  fontes = ["F3", "F5"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita. Na frase a favor, o prato verde acende com um velocímetro marcando '+11%' sobre um mapa genérico com o rótulo 'Nova York' e uma vitrine de loja acesa. Na frase contra, o prato coral acende com o Zé olhando a carteira aberta e um ponto de ônibus ao fundo. No termômetro, os dois apagam e ela termina equilibrada."

