# Roteiro: a fonte da verdade do vídeo. O 03-roteiro.md é gerado pelo scripts/roteiro.py.
# Onda 2, versão 1. F11 e F12 (balança) não foram conferidas por busca: o roteiro.py barra até
# terem data de acesso. F13 (termômetro) foi conferida só por resumo de terceiros (02-fontes.md).

titulo = "E se o real voltasse ao padrão-ouro?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro: à esquerda, uma pilha alta de notas genéricas com 'R$'; à direita, uma pilha de barras de ouro com só um terço da altura, e a marca '1/3' entre as duas. O Zé olha de uma pilha para a outra, coçando a cabeça. Câmera sobe devagar."

  [[bloco.frase]]
  fala = "Ouro para um terço das notas."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "Ouro do Banco Central: R$ 131 bi · Notas e moedas: R$ 368 bi (dez/2025)"

  [[bloco.frase]]
  fala = "E se o real voltasse ao padrão-ouro? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Um cofre genérico com a placa 'Banco Central' em texto simples; ao lado, uma pizza com a fatia dourada de 7%. O Zé estende uma nota no guichê do cofre e a janelinha fecha. Na premissa, aparece o selo 'SUPOSIÇÃO: só o Brasil' e a janelinha abre, com uma barra de ouro do outro lado."

  [[bloco.frase]]
  fala = "Hoje, ninguém troca reais por ouro no Banco Central, e o metal é só cerca de 7% das reservas."
  marcacao = "FATO"
  fontes = ["F2", "F4"]
  tela = "Ouro: cerca de 7% das reservas (2025)"
  voz = "Hoje, ninguém troca reais por ouro no Banco Central, e o metal é só cerca de sete por cento das reservas."

  [[bloco.frase]]
  fala = "Aqui, vamos supor que só o Brasil faria essa troca, a um preço fixo."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "A pilha de ouro cresce até a altura das notas enquanto um saco de dólares ao lado encolhe um pouco (contador 'ouro × 2,8'). Depois, um gráfico de linha do preço do grama de ouro sobe até o pico de janeiro e desce até outubro; uma corda liga a linha a uma nota de real, que desce junto. Por fim, a etiqueta de um celular importado na mão do Zé aumenta e ele franze a testa."

  [[bloco.frase]]
  fala = "Para cobrir todas as notas, o Banco Central teria que quase triplicar o ouro, com dólares das reservas."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F2"]
  tela = "Ouro × 2,8"

  [[bloco.frase]]
  fala = "E o ouro oscila: em janeiro, o grama passou de US$ 160; em outubro, estava perto de US$ 130."
  marcacao = "FATO"
  fontes = ["F5", "F6"]
  tela = "Ouro, US$ por grama: jan/2026 acima de 160 · out/2026 perto de 132"
  voz = "E o ouro oscila: em janeiro, o grama passou de cento e sessenta dólares; em outubro, estava perto de cento e trinta."

  [[bloco.frase]]
  fala = "Com o real preso a ele, uma queda assim deixaria o dólar e o celular importado mais caros aqui."
  marcacao = "PROJEÇÃO"
  fontes = ["F5", "F6"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda, com um carrinho de supermercado cuja etiqueta de preço fica parada enquanto um calendário de 1880 a 1913 passa rápido; prato coral (contra) à direita, com uma chaminé de fábrica que volta a soltar fumaça quando o Zé solta uma corrente dourada presa ao pulso. Cada prato acende na sua frase. No termômetro, os pratos apagam, a balança segue equilibrada e um termômetro ao lado marca 'quase consenso contra'."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que, no padrão-ouro antes da Primeira Guerra, a inflação média ficou perto de zero por décadas, porque o dinheiro novo dependia de ouro novo."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F11"]

  [[bloco.frase]]
  fala = "Quem critica aponta que, na crise de 1929, os países que largaram o ouro mais cedo puderam baixar os juros e se recuperaram mais rápido."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F12"]
  voz = "Quem critica aponta que, na crise de mil novecentos e vinte e nove, os países que largaram o ouro mais cedo puderam baixar os juros e se recuperaram mais rápido."

  [[bloco.frase]]
  fala = "Entre economistas, há quase consenso contra o padrão-ouro: em 2012, num painel dos Estados Unidos, nenhum concordou que ele traria preços mais estáveis e mais emprego."
  marcacao = "TERMÔMETRO"
  fontes = ["F13"]
  voz = "Entre economistas, há quase consenso contra o padrão-ouro: em dois mil e doze, num painel dos Estados Unidos, nenhum concordou que ele traria preços mais estáveis e mais emprego."

# Exemplo real cortado: a crise de 1929 e o padrão-ouro de antes de 1914 já aparecem, com fonte,
# nos dois lados da balança. A conversibilidade do mil-réis (1906–1914) não foi conferida por
# busca nesta sessão e ficou de fora (01-ideia.md).

