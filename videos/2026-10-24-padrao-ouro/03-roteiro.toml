# elo da troca (R2.1), mecanismo de volta ao pró e juros no contra (R2.3), rodapé do cálculo (R2.4).

titulo = "E se o Brasil voltasse ao padrão-ouro?"
versao = 3

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro: à esquerda, uma pilha alta de notas genéricas com 'R$'; à direita, uma pilha de barras de ouro com só um terço da altura, e a marca '1/3' entre as duas. O Zé olha de uma pilha para a outra, coçando a cabeça. Câmera sobe devagar."

  [[bloco.frase]]
  fala = "Ouro para um terço das notas."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "Ouro do Banco Central: R$ 131 bi · Notas e moedas: R$ 368 bi (dez/2025)"

  [[bloco.frase]]
  fala = "E se o Brasil voltasse ao padrão-ouro? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Um cofre genérico com a placa 'Banco Central' em texto simples; ao lado, uma pizza com a fatia dourada de 7%. O Zé estende uma nota no guichê do cofre e a janelinha fecha. Na premissa, aparece o selo 'SUPOSIÇÃO: só o Brasil' e a janelinha abre, com uma barra de ouro do outro lado."

  [[bloco.frase]]
  fala = "Hoje, ninguém troca reais por ouro no Banco Central, e o metal é só cerca de 7% das reservas."
  marcacao = "FATO"
  fontes = ["F2", "F4"]
  tela = "Ouro: cerca de 7% das reservas (2025)"
  voz = "Hoje, ninguém troca reais por ouro no Banco Central, e o metal é só cerca de sete por cento das reservas."

  [[bloco.frase]]
  fala = "Aqui, vamos supor que só o Brasil faria essa troca, a um preço fixo."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "A pilha de ouro cresce até a altura das notas enquanto um saco de dólares ao lado encolhe um pouco (contador 'ouro × 2,8 só para as notas'); atrás, aparece uma pilha muito maior com a etiqueta 'contas, poupança e CDBs'. Depois, um termostato com a palavra 'juros' fica preso por um cadeado dourado; quando o Zé tenta girá-lo para baixo, uma fila de pessoas com notas aparece no guichê do ouro. Por fim, um gráfico de linha do grama de ouro sobe até janeiro e desce até outubro; a etiqueta de um celular importado na mão do Zé desce quando a linha sobe e sobe quando a linha desce."

  [[bloco.frase]]
  fala = "Só para cobrir as notas, o Banco Central teria que quase triplicar o ouro, com dólares das reservas."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F2", "F8"]
  tela = "Ouro × 2,8 só para as notas · contas, poupança e CDBs (M2): R$ 7,6 tri (jun/2026)"

  [[bloco.frase]]
  fala = "E os juros ficariam presos à troca: numa crise, baixá-los poderia levar muita gente a trocar reais por ouro."
  marcacao = "PROJEÇÃO"
  fontes = ["F12", "F14"]

  [[bloco.frase]]
  fala = "E o ouro oscila: o grama quase dobrou em dólar em pouco mais de um ano, e depois caiu."
  marcacao = "FATO"
  fontes = ["F16", "F5", "F6"]
  tela = "Ouro, US$ por grama: dez/2024 ≈ 84 · jan/2026 acima de 160 · out/2026 ≈ 132"

  [[bloco.frase]]
  fala = "Preso a ele, o real seguiria o ouro: ouro em alta, dólar e celular importado mais baratos; ouro em baixa, mais caros."
  marcacao = "PROJEÇÃO"
  fontes = ["F16", "F5", "F6"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda, com um carrinho de supermercado cuja etiqueta de preço fica parada enquanto um calendário de 1880 a 1914 passa rápido; prato coral (contra) à direita, com uma chaminé de fábrica que volta a soltar fumaça quando o Zé solta uma corrente dourada presa ao pulso. Cada prato acende na sua frase. No termômetro, os pratos apagam, a balança segue equilibrada e um termômetro ao lado marca 'quase consenso contra'."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que, nos Estados Unidos antes da Primeira Guerra, com o dólar preso ao ouro e sem imprimir dinheiro à vontade, a inflação média foi de 0,1% ao ano."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F11"]
  tela = "EUA, 1880–1914: inflação média de 0,1% ao ano"
  voz = "Quem defende aponta que, nos Estados Unidos antes da Primeira Guerra, com o dólar preso ao ouro e sem imprimir dinheiro à vontade, a inflação média foi de zero vírgula um por cento ao ano."

  [[bloco.frase]]
  fala = "Quem critica aponta que, na crise de 1929, os países que largaram o ouro mais cedo e puderam baixar os juros voltaram a crescer antes."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F12", "F14"]
  voz = "Quem critica aponta que, na crise de mil novecentos e vinte e nove, os países que largaram o ouro mais cedo e puderam baixar os juros voltaram a crescer antes."

  [[bloco.frase]]
  fala = "Entre economistas, há quase consenso contra o padrão-ouro: em 2012, num painel de universidades americanas, nenhum concordou que ele traria preços mais estáveis e mais emprego aos Estados Unidos."
  marcacao = "TERMÔMETRO"
  fontes = ["F13"]
  tela = "Painel de economistas de universidades dos EUA, 2012, sobre os EUA: nenhum a favor"
  voz = "Entre economistas, há quase consenso contra o padrão-ouro: em dois mil e doze, num painel de universidades americanas, nenhum concordou que ele traria preços mais estáveis e mais emprego aos Estados Unidos."

