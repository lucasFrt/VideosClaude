# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
#
# Versão escolhida (01-ideia.md): imposto único sobre movimentação financeira, cobrado de quem
# paga e de quem recebe, no lugar de todos os tributos; alíquota dos proponentes (F1).

titulo = "E se o Brasil tivesse um imposto único?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com dois cofrinhos ligados por uma seta: uma moeda sai do cofrinho do Zé e vai para o da padaria, e cada cofrinho perde uma fatia amarela com o número 2,81%; o Zé olha surpreso. Sem celular, aplicativo ou símbolo de pagamento."

  [[bloco.frase]]
  fala = "Quase 3%, duas vezes."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "2,81% de quem paga + 2,81% de quem recebe"
  voz = "Quase três por cento, duas vezes."

  [[bloco.frase]]
  fala = "E se o Brasil tivesse um imposto único? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma pilha de guias e boletos de impostos ao lado do Zé; um carimbo antigo com 'CPMF 0,38%' e o contador do ano parando em 2007; depois a pilha se junta num único boleto, com um cadeado de 'Constituição' que se abre."

  [[bloco.frase]]
  fala = "O Brasil já teve a CPMF: até 0,38% do dinheiro que saía das contas, além dos outros impostos."
  marcacao = "FATO"
  fontes = ["F2", "F3"]
  tela = "CPMF: até 0,38% (1997–2007)"
  voz = "O Brasil já teve a CPMF: até zero vírgula trinta e oito por cento do dinheiro que saía das contas, além dos outros impostos."

  [[bloco.frase]]
  fala = "Aqui, vamos supor que a Constituição muda e que o imposto único substitui todos os outros, arrecadando o mesmo, pelo cálculo de quem defende."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "O Zé recebe o salário e um robô-caixa do banco tira uma fatia na hora, sem papel; depois a cadeia do pão: um saco de trigo vira farinha, a farinha chega à padaria e o pão chega ao Zé, e a cada passagem uma fatia amarela se empilha na etiqueta de preço; por fim, o Zé guarda notas num colchão e o número da alíquota sobe aos poucos."

  [[bloco.frase]]
  fala = "No curto prazo, sumiriam guias e declarações: o banco descontaria o imposto único na hora, de quem paga e de quem recebe."
  marcacao = "PROJEÇÃO"
  fontes = ["F9", "F8"]

  [[bloco.frase]]
  fala = "Mas o pão passa por várias mãos, e cada pagamento no caminho pagaria de novo, somando no preço."
  marcacao = "PROJEÇÃO"
  fontes = ["F4", "F5"]

  [[bloco.frase]]
  fala = "No longo prazo, parte das pessoas e empresas fugiria do banco, e a alíquota teria que subir para compensar; ninguém sabe quanto."
  marcacao = "PROJEÇÃO"
  fontes = ["F7", "F6", "F5"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; cada prato acende na sua frase; no termômetro, os dois apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que seria simples e difícil de sonegar, porque o banco cobra na hora: a CPMF arrecadou assim por cerca de dez anos."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F9", "F8", "F2"]

  [[bloco.frase]]
  fala = "Quem critica aponta que ele se acumula a cada etapa e afasta o dinheiro dos bancos: nos países latino-americanos estudados, a arrecadação caía com o tempo."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F4", "F7", "F6"]

  [[bloco.frase]]
  fala = "A maioria dos estudos concorda: baixo e junto com outros, esse imposto arrecada; alto e sozinho, tende a pesar nos preços e espantar o dinheiro dos bancos."
  marcacao = "TERMÔMETRO"
  fontes = ["F7", "F8", "F4", "F10"]

# Exemplo real omitido: a CPMF (1997–2007) já aparece, com fonte, no contexto e no lado a favor,
# e o estudo do Banco Central sobre ela (F6) apoia o lado contra; não encontramos país que tenha
# usado um imposto sobre movimentação como imposto único. Cortar também ajuda a ficar abaixo de 80 s.

[[bloco]]
nome = "Encerramento"
cena = "Zé de frente para a câmera segurando um único boleto, ombros levantados, esperando a resposta."

  [[bloco.frase]]
  fala = "E aí, você toparia? Me conta nos comentários."
  marcacao = "BORDÃO"
