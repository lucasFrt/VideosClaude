#
# Versão escolhida (01-ideia.md): imposto único sobre movimentação financeira, cobrado de quem
# paga e de quem recebe, no lugar de todos os tributos; alíquota dos proponentes (F1).
# Versão 2: respostas à rodada 1 do crítico (04-revisoes.md, R1.1 a R1.7).
# Versão 3: respostas à rodada 2 (R2.1 a R2.3).
# Versão 4: ajustes menores da rodada 3 (R3.2: cenas e "muitas guias").

titulo = "E se o Brasil tivesse um imposto único?"
versao = 4

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com dois cofrinhos ligados por uma seta: uma moeda sai do cofrinho do Zé e vai para o da padaria, e cada cofrinho perde uma fatia amarela com o número 2,81%; o Zé olha surpreso. Sem celular, aplicativo ou símbolo de pagamento."

  # PREMISSA (R1.6): a alíquota é a conta de quem defende, que o vídeo assume; a tela e o
  # rodapé dizem de onde vem, e a fala atribui no bloco 2.
  [[bloco.frase]]
  fala = "Quase 3%, duas vezes."
  marcacao = "PREMISSA"
  fontes = ["F1"]
  tela = "Conta de quem defende: 2,81% de quem paga + 2,81% de quem recebe"
  voz = "Quase três por cento, duas vezes."

  [[bloco.frase]]
  fala = "E se o Brasil tivesse um imposto único? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma pilha de guias e boletos de impostos ao lado do Zé; um carimbo antigo com 'CPMF 0,38%' e o ano 2007; o contador sobe de 0,38% para 5,62% e uma barra cresce quase quinze vezes ao lado da da CPMF; depois um cadeado de 'Constituição' se abre e a pilha encolhe até sobrarem poucas guias."

  [[bloco.frase]]
  fala = "A antiga CPMF levava até 0,38% do que saía das contas, além dos outros impostos."
  marcacao = "FATO"
  fontes = ["F12", "F3"]
  tela = "CPMF: até 0,38% (1997–2007)"
  voz = "A antiga CPMF levava até zero vírgula trinta e oito por cento do que saía das contas, além dos outros impostos."

  [[bloco.frase]]
  fala = "Pelo cálculo de quem defende, somando os dois lados, o imposto único seria quase 15 vezes isso."
  marcacao = "FATO"
  fontes = ["F1", "F3"]
  tela = "0,38% → 5,62% (quase 15 vezes)"
  voz = "Pelo cálculo de quem defende, somando os dois lados, o imposto único seria quase quinze vezes isso."

  [[bloco.frase]]
  fala = "Aqui, vamos supor que a Constituição muda e que ele substitui quase todos os outros, arrecadando o mesmo."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "O Zé recebe o salário e um robô-caixa do banco tira uma fatia na hora, sem papel; depois a cadeia do pão: trigo, moinho, padaria e Zé, e a cada passagem uma fatia amarela se empilha na etiqueta de preço, ao lado de um ovo da granja, de cadeia curta, com menos fatias; por fim, o Zé paga a feira com notas de papel, duas caixas de fábrica se juntam numa só e o número da alíquota sobe aos poucos, com um ponto de interrogação."

  [[bloco.frase]]
  fala = "No curto prazo, sumiriam muitas guias e declarações: o banco descontaria o imposto único na hora."
  marcacao = "PROJEÇÃO"
  fontes = ["F9", "F13"]

  [[bloco.frase]]
  fala = "Mas o pão passa por várias mãos, e cada uma pagaria de novo: quanto mais etapas, mais imposto no preço."
  marcacao = "PROJEÇÃO"
  fontes = ["F5", "F4", "F10"]

  [[bloco.frase]]
  fala = "No longo prazo, algumas empresas juntariam etapas e mais gente usaria dinheiro vivo; para compensar, a alíquota subiria, ninguém sabe quanto."
  marcacao = "PROJEÇÃO"
  fontes = ["F5", "F13", "F6", "F8", "F7"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; cada prato acende na sua frase; no termômetro, os dois apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que, com todo mundo pagando, inclusive quem hoje sonega, quem já paga pagaria menos; e sacar dinheiro vivo custaria o dobro."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F1", "F13", "F9"]

  [[bloco.frase]]
  fala = "Quem critica aponta que até a CPMF, muito menor, fez cair o uso de cheques e deixou o crédito mais caro."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F6", "F3"]

  [[bloco.frase]]
  fala = "Estudos do FMI, da OCDE e do Banco Central concordam: baixo como a CPMF, esse imposto arrecada, mas cada aumento afasta dinheiro dos bancos. Como imposto único, que se saiba, nenhum país testou."
  marcacao = "TERMÔMETRO"
  fontes = ["F8", "F7", "F6", "F4"]

