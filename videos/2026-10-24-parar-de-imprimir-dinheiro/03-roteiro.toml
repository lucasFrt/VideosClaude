titulo = "E se o Brasil parasse de imprimir dinheiro?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o número '1,35 bilhão de notas' enorme sobre uma impressora low-poly que solta maços de notas genéricas (sem o desenho das cédulas reais); o Zé surpreso, olhando a pilha crescer."

  [[bloco.frase]]
  fala = "Mais de um bilhão de notas."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "1,35 bilhão de notas novas em 2025"

  [[bloco.frase]]
  fala = "E se o Brasil parasse de imprimir dinheiro? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Notas velhas e rasgadas entram numa trituradora enquanto notas novas saem da impressora, uma por uma; depois um livro grosso com a etiqueta 'Constituição' fecha um cadeado no cofre com a etiqueta 'Banco Central'; por fim, o Zé recebe um empréstimo na agência genérica da cidade e o valor aparece como saldo na tela do celular dele."

  [[bloco.frase]]
  fala = "É o que o Banco Central solta por ano, e a maior parte só troca nota gasta."
  marcacao = "FATO"
  fontes = ["F1", "F5", "F6"]

  [[bloco.frase]]
  fala = "E o governo não pode pedir dinheiro novo ao Banco Central para pagar conta: a Constituição proíbe."
  marcacao = "FATO"
  fontes = ["F7"]

  [[bloco.frase]]
  fala = "A maior parte do dinheiro nasce quando os bancos emprestam."
  marcacao = "FATO"
  fontes = ["F8", "F2", "F4"]

[[bloco]]
nome = "O que mudaria"
cena = "O cofre 'Banco Central' com o contador 'R$ 447 bilhões' trava com um cadeado; no fim do ano, o Zé na fila do caixa eletrônico enquanto um medidor de juros sobe aos saltos; depois a vitrine da cidade com o preço do pão descendo devagar (Zé feliz) e o boleto de uma dívida que fica maior ao lado do contracheque dele (Zé preocupado)."

  [[bloco.frase]]
  fala = "Aqui, vamos supor que o Banco Central congela o dinheiro que só ele cria, notas e saldo dos bancos nele, e o resto fica igual."
  marcacao = "PREMISSA"
  fontes = ["F2"]
  tela = "R$ 447 bilhões (fim de 2025)"

  [[bloco.frase]]
  fala = "No fim do ano, quando todo mundo saca mais, o Banco Central não poderia soltar mais, e os juros poderiam saltar."
  marcacao = "PROJEÇÃO"
  fontes = ["F2", "F11"]

  [[bloco.frase]]
  fala = "No longo prazo, se a economia crescer e esse dinheiro não, os preços tenderiam a subir menos ou até cair. Ninguém sabe quanto."
  marcacao = "PROJEÇÃO"
  fontes = ["F9", "F13"]

  [[bloco.frase]]
  fala = "O pão poderia baixar, mas o salário subiria menos, e as dívidas pesariam mais."
  marcacao = "PROJEÇÃO"
  fontes = ["F9", "F14"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; cada prato acende na sua frase; no termômetro, os dois apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que, em mais de cem países, quem criou mais dinheiro teve mais inflação: uma regra fixa evitaria isso."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F9"]

  [[bloco.frase]]
  fala = "Quem critica aponta que, nos anos oitenta, bancos centrais tentaram controlar a quantidade de dinheiro e desistiram: a ligação com os preços mudava demais."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F11", "F13"]

  [[bloco.frase]]
  fala = "Entre os economistas, há quase consenso: criar dinheiro sem limite para pagar gastos gera inflação. Já travar a quantidade de dinheiro tem pouco apoio; os grandes bancos centrais preferem os juros."
  marcacao = "TERMÔMETRO"
  fontes = ["F10", "F9", "F11", "F13", "F16"]

