# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
# Versão 3: respostas às rodadas 1 e 2 do crítico (04-revisoes.md).

titulo = "E se o Brasil parasse de imprimir dinheiro?"
versao = 3

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o número '1,35 bilhão de notas' enorme sobre uma impressora low-poly que solta maços de notas genéricas (sem o desenho das cédulas reais); ao lado, uma pilha de notas velhas e rasgadas segue para a trituradora, no mesmo ritmo; o Zé surpreso, olhando as duas."

  [[bloco.frase]]
  fala = "Mais de um bilhão de notas."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "1,35 bilhão de notas novas em 2025 (a maior parte repõe notas gastas)"

  [[bloco.frase]]
  fala = "E se o Brasil parasse de imprimir dinheiro? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Notas velhas e rasgadas entram numa trituradora enquanto notas novas saem da impressora, uma por uma; depois um livro grosso com a etiqueta 'Constituição' fica de pé no caminho entre o cofre 'Banco Central' e um cofre 'Governo', bloqueando a passagem (sem cadeado, para não confundir com o congelamento do bloco seguinte); por fim, o Zé recebe um empréstimo na agência genérica da cidade e o valor aparece como saldo na tela do celular dele."

  [[bloco.frase]]
  fala = "Esse tanto sai por ano, mas a maior parte só troca nota gasta."
  marcacao = "FATO"
  fontes = ["F1", "F5", "F6"]

  [[bloco.frase]]
  fala = "E o governo não pode pagar conta com empréstimo do Banco Central: a Constituição proíbe."
  marcacao = "FATO"
  fontes = ["F7"]

  [[bloco.frase]]
  fala = "A maior parte do dinheiro nasce quando os bancos emprestam."
  marcacao = "FATO"
  fontes = ["F8", "F2", "F4"]

[[bloco]]
nome = "O que mudaria"
cena = "O cofre 'Banco Central', com o contador 'R$ 447 bilhões' (notas + saldo dos bancos), fica preso num bloco de gelo e um medidor 'Selic' sai de cena; no Natal, o Zé na fila do caixa eletrônico enquanto uma barra 'saldo dos bancos no BC' encolhe e um medidor 'juros entre bancos' sobe aos saltos, e a etiqueta de juros de um crediário na vitrine sobe junto; depois a agência da cidade empresta mais devagar e o preço do pão na vitrine desce devagar (Zé feliz); por fim, o contracheque do Zé fica parado enquanto o boleto de uma dívida parece maior ao lado dele (Zé preocupado)."

  [[bloco.frase]]
  fala = "Aqui, vamos supor que o Banco Central congela o total de notas e saldo dos bancos nele, em vez de controlar os juros, e o resto fica igual."
  marcacao = "PREMISSA"
  fontes = ["F2"]
  tela = "R$ 447 bilhões (fim de 2025)"

  [[bloco.frase]]
  fala = "No Natal, os saques encolheriam o saldo dos bancos no Banco Central: os juros entre bancos poderiam saltar e encarecer o crédito."
  marcacao = "PROJEÇÃO"
  fontes = ["F2", "F5", "F11"]

  [[bloco.frase]]
  fala = "No longo prazo, com esse dinheiro parado, os bancos emprestariam mais devagar, e o pão tenderia a subir menos ou até baixar. Ninguém sabe quanto."
  marcacao = "PROJEÇÃO"
  fontes = ["F8", "F9", "F13"]

  [[bloco.frase]]
  fala = "Se os preços caírem, o salário quase não cai junto: pode custar empregos, e as dívidas pesariam mais."
  marcacao = "PROJEÇÃO"
  fontes = ["F22", "F14"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; cada prato acende na sua frase; no termômetro, os dois apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que uma regra fixa tira a tentação de criar dinheiro, e que, em mais de cem países, mais dinheiro veio com mais inflação."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F24", "F19", "F9"]

  [[bloco.frase]]
  fala = "Quem critica aponta que, nos anos setenta e oitenta, Estados Unidos, Canadá e Inglaterra tentaram controlar a quantidade de dinheiro e desistiram: a ligação com os preços falhava."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F11", "F17", "F18"]

  [[bloco.frase]]
  fala = "Num painel de economistas americanos, ninguém achou que dá para gastar sem limite criando dinheiro. Sobre congelar, não achamos pesquisa; os grandes bancos centrais preferem os juros."
  marcacao = "TERMÔMETRO"
  fontes = ["F10", "F8", "F11", "F16"]
  tela = "Ninguém concordou que dá para gastar sem limite criando dinheiro (painel de economistas dos EUA, 2019)"

# Exemplo real cortado na versão 1 para caber perto de 75 s (CLAUDE.md, seção 3): os paralelos
# mais próximos (as metas de quantidade de moeda dos EUA, do Canadá e da Inglaterra, de 1975 a 1987,
# F11, F17 e F18) não são iguais ao cenário, porque não congelaram nada, e já aparecem no lado
# contra da balança.

