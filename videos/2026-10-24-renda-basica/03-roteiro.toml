[[bloco]]
nome = "Encerramento"
cena = "Zé de frente para a câmera, segurando um envelope, ombros levantados, esperando a resposta."

  [[bloco.frase]]
  fala = "E aí, você toparia? Me conta nos comentários."
  marcacao = "BORDÃO"
