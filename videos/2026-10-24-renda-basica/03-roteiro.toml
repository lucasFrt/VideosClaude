# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
#
# Cada frase tem:
#   fala      o texto do narrador, como deve ser lido no roteiro (pode ter algarismos)
#   marcacao  FATO, PROJEÇÃO, PREMISSA, ARGUMENTO A FAVOR, ARGUMENTO CONTRA, TERMÔMETRO ou BORDÃO
#             (PREMISSA: uma simplificação do cenário, dita no vídeo; vem do 01-ideia.md)
#   fontes    códigos do 02-fontes.md (obrigatório em tudo, menos BORDÃO e PREMISSA)
#   tela      (opcional) número ou texto que aparece na tela; o rodapé de fonte sai das fontes
#   voz       (opcional) a fala escrita como a voz deve ler, com números por extenso
#
# As contas (custo, % do PIB, vezes o Bolsa Família, R$ 5.000 por família) estão no
# 02-fontes.md, seção "Contas do canal".

titulo = "E se todo brasileiro recebesse uma renda básica?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o contador enorme parando em 'quase R$ 1,3 trilhão por ano', sobre uma pilha alta de notas low-poly genéricas (sem o desenho das cédulas reais); embaixo, menor, a conta '214 milhões × R$ 500 × 12'. O Zé olha para cima, boquiaberto, enquanto a câmera sobe devagar pela pilha."

  [[bloco.frase]]
  fala = "Quase R$ 1,3 trilhão por ano."
  marcacao = "PROJEÇÃO"
  fontes = ["F1"]
  tela = "Quase R$ 1,3 trilhão por ano (214 milhões × R$ 500 × 12)"
  voz = "Quase um vírgula três trilhão de reais por ano."

  [[bloco.frase]]
  fala = "E se todo brasileiro recebesse uma renda básica? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma rua low-poly vista de cima: só algumas casas acendem em amarelo e recebem um envelope genérico (sem logotipo de programa ou de banco), com o contador '19 milhões de famílias'. Depois, uma folha com '2004' sai de uma gaveta e volta para ela, empoeirada."

  [[bloco.frase]]
  fala = "Hoje, o Bolsa Família paga só a famílias de baixa renda: cerca de 19 milhões delas."
  marcacao = "FATO"
  fontes = ["F4", "F6"]
  tela = "19 milhões de famílias"
  voz = "Hoje, o Bolsa Família paga só a famílias de baixa renda: cerca de dezenove milhões delas."

  [[bloco.frase]]
  fala = "Uma renda para todos até está numa lei de 2004, mas nunca saiu do papel."
  marcacao = "FATO"
  fontes = ["F5", "F7"]
  tela = "Lei de 2004: renda para todos"
  voz = "Uma renda para todos até está numa lei de dois mil e quatro, mas nunca saiu do papel."

[[bloco]]
nome = "O que mudaria"
cena = "A mesma rua: agora todas as casas acendem, da casinha do Zé a uma mansão, e um envelope cai em cada uma (um bebê num berço também recebe o seu). Contadores '≈ 10% do PIB' e '≈ 8 vezes o Bolsa Família'. O Zé, com a família de quatro, conta quatro notas, feliz; na mansão, uma seta coral leva de volta, em impostos, uma pilha maior do que a que chegou. No fim, um relógio girando com um ponto de interrogação em cima da rua."

  [[bloco.frase]]
  fala = "Aqui, vamos supor R$ 500 por mês para cada pessoa, do bebê ao bilionário, sem condição, pagos com mais impostos."
  marcacao = "PREMISSA"
  voz = "Aqui, vamos supor quinhentos reais por mês para cada pessoa, do bebê ao bilionário, sem condição, pagos com mais impostos."

  [[bloco.frase]]
  fala = "Com esse valor, dá cerca de 10% de tudo que o país produz num ano: umas oito vezes o Bolsa Família."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F2", "F3"]
  tela = "≈ 10% do PIB · ≈ 8 vezes o Bolsa Família"
  voz = "Com esse valor, dá cerca de dez por cento de tudo que o país produz num ano: umas oito vezes o Bolsa Família."

  [[bloco.frase]]
  fala = "No curto prazo, uma família de quatro teria R$ 2.000 a mais por mês, e quem ganha mais tenderia a pagar mais imposto do que recebe."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F2"]
  voz = "No curto prazo, uma família de quatro teria dois mil reais a mais por mês, e quem ganha mais tenderia a pagar mais imposto do que recebe."

  [[bloco.frase]]
  fala = "No longo prazo, o país teria de manter esse imposto todo ano, e ninguém sabe ao certo como a economia reagiria."
  marcacao = "PROJEÇÃO"
  fontes = ["F8", "F9", "F13", "F14"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita. Na frase a favor, o prato verde acende com o Zé passando direto por uma mesa de formulários e uma vila low-poly com bancas de pequenos negócios; na frase contra, o prato coral acende com um cofre aberto e uma única casa recebendo uma pilha de notas. No termômetro, os dois pratos apagam e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que ninguém precisaria provar que é pobre nem perderia o dinheiro ao arrumar emprego, e que, num teste no Quênia, o trabalho não caiu."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F5", "F9"]

  [[bloco.frase]]
  fala = "Quem critica aponta que exigiria muito mais imposto, e que o mesmo dinheiro daria mais de R$ 5.000 mensais a cada família do Bolsa Família."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F1", "F2", "F4"]
  voz = "Quem critica aponta que exigiria muito mais imposto, e que o mesmo dinheiro daria mais de cinco mil reais mensais a cada família do Bolsa Família."

  [[bloco.frase]]
  fala = "Na maioria dos estudos, dar dinheiro mexe pouco no trabalho; mas, numa pesquisa nos Estados Unidos, a maioria dos economistas foi contra trocar todos os programas sociais por uma renda universal."
  marcacao = "TERMÔMETRO"
  fontes = ["F12", "F9", "F11", "F8", "F13", "F14", "F15"]

