  [[bloco.frase]]
  fala = "Lá fora, a maioria dos estudos vê pouco efeito no trabalho; no Brasil, eles divergem. Nos Estados Unidos, a maioria dos economistas consultados rejeitou trocar até a aposentadoria por uma renda universal."
  marcacao = "TERMÔMETRO"
  fontes = ["F12", "F9", "F13", "F14", "F18", "F15"]
