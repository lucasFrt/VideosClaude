# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
#
# Cada frase tem:
#   fala      o texto do narrador, como deve ser lido no roteiro (pode ter algarismos)
#   marcacao  FATO, PROJEÇÃO, PREMISSA, ARGUMENTO A FAVOR, ARGUMENTO CONTRA, TERMÔMETRO ou BORDÃO
#             (PREMISSA: uma simplificação do cenário, dita no vídeo; vem do 01-ideia.md)
#   fontes    códigos do 02-fontes.md (obrigatório em tudo, menos BORDÃO e PREMISSA)
#   tela      (opcional) número ou texto que aparece na tela; o rodapé de fonte sai das fontes
#   voz       (opcional) a fala escrita como a voz deve ler, com números por extenso
#
# As contas (custo, % do PIB, fatia da arrecadação federal, R$ 5.000 por família) estão no
# 02-fontes.md, seção "Contas do canal". Versões 2 a 5: respostas às rodadas 1 a 3 do crítico (04-revisoes.md).

titulo = "E se todo brasileiro recebesse uma renda básica?"
versao = 5

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o contador enorme parando em 'quase R$ 1,3 trilhão por ano', sobre uma pilha alta de notas low-poly genéricas (sem o desenho das cédulas reais); embaixo, menor, a conta '214 milhões × R$ 500 × 12'. O Zé olha para cima, boquiaberto, enquanto a câmera sobe devagar pela pilha."

  [[bloco.frase]]
  fala = "R$ 500 por pessoa: quase R$ 1,3 trilhão por ano."
  marcacao = "PROJEÇÃO"
  fontes = ["F1"]
  tela = "Quase R$ 1,3 trilhão por ano (214 milhões × R$ 500 × 12)"
  voz = "Quinhentos reais por pessoa: quase um vírgula três trilhão por ano."

  [[bloco.frase]]
  fala = "E se todo brasileiro recebesse uma renda básica? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma rua low-poly vista de cima: só algumas casas acendem em amarelo e recebem um envelope genérico (sem logotipo de programa ou de banco), com o contador '19 milhões de famílias'. Ao lado, uma escada em tons neutros, com a etiqueta 'renda para todos, em etapas (lei de 2004)', que continua para baixo e para cima além do quadro, sem número de degraus; um degrau no meio do trecho visível ganha o rótulo 'Bolsa Família: uma das etapas'. Nenhum degrau aparece apagado ou quebrado."

  [[bloco.frase]]
  fala = "Hoje, o Bolsa Família atende só famílias de baixa renda, cerca de 19 milhões: por lei, uma etapa da renda para todos."
  marcacao = "FATO"
  fontes = ["F4", "F5", "F6"]
  tela = "19 milhões de famílias · renda para todos, em etapas (lei de 2004)"
  voz = "Hoje, o Bolsa Família atende só famílias de baixa renda, cerca de dezenove milhões: por lei, uma etapa da renda para todos."

[[bloco]]
nome = "O que mudaria"
cena = "A mesma rua: agora um envelope verde, diferente do amarelo do contexto, cai em todas as casas, da casinha do Zé a uma mansão (um bebê num berço também recebe o seu); as casas que já tinham o envelope amarelo continuam com ele e recebem o verde ao lado. Contadores '≈ 10% do PIB' e 'quase metade da arrecadação federal'. O Zé, com a família de quatro, conta quatro notas e devolve uma parte por uma seta coral fina de imposto; na mansão, uma seta coral grossa leva de volta uma pilha maior do que a que chegou. No fim, um relógio girando com um ponto de interrogação em cima da rua."

  [[bloco.frase]]
  fala = "Aqui, vamos supor R$ 500 por mês para cada pessoa, do bebê ao bilionário, além dos benefícios de hoje, sem exigir nada, pagos com mais impostos."
  marcacao = "PREMISSA"
  tela = "R$ 500/mês para todos, além dos benefícios de hoje (hipótese)"
  voz = "Aqui, vamos supor quinhentos reais por mês para cada pessoa, do bebê ao bilionário, além dos benefícios de hoje, sem exigir nada, pagos com mais impostos."

  [[bloco.frase]]
  fala = "Isso é cerca de 10% de tudo que o país produz, quase metade do que o governo federal arrecada."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F2", "F19"]
  tela = "≈ 10% do PIB · quase metade da arrecadação federal"
  voz = "Isso é cerca de dez por cento de tudo que o país produz, quase metade do que o governo federal arrecada."

  [[bloco.frase]]
  fala = "Uma família de quatro receberia R$ 2.000 por mês, mas poderia devolver parte em impostos; quem ganha acima da média tenderia a devolver mais do que recebe."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F19"]
  voz = "Uma família de quatro receberia dois mil reais por mês, mas poderia devolver parte em impostos; quem ganha acima da média tenderia a devolver mais do que recebe."

  [[bloco.frase]]
  fala = "No longo prazo, ninguém sabe ao certo como a economia reagiria."
  marcacao = "PROJEÇÃO"
  fontes = ["F8", "F9", "F13", "F14", "F18", "F21"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita. Na frase a favor, o prato verde acende com o Zé passando direto por uma mesa de formulários e uma vila low-poly genérica com bancas de pequenos negócios; na frase contra, o prato coral acende com as notas de todas as casas da rua se juntando numa pilha só, que vai para as casas de baixa renda. No termômetro, os dois pratos apagam e ela termina equilibrada; a tela do termômetro vem em dois cartões sincronizados com a fala: o cartão 1 (estudos sobre trabalho) na primeira frase e o cartão 2 (pesquisa com economistas) na segunda, cada um num bloco só e curto. O rodapé, com as fontes dos dois cartões, fica na tela a frase inteira."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que ninguém precisaria provar que é pobre, e que, num teste em vilas pobres do Quênia, o trabalho total não caiu."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F9"]
  tela = "Teste no Quênia: o total de trabalho não caiu"

  [[bloco.frase]]
  fala = "Quem critica aponta que é caro demais: se fosse só para aquelas famílias, daria mais de R$ 5.000 por mês a cada uma."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F1", "F4"]
  tela = "Só para 19 milhões de famílias: mais de R$ 5.000 por mês a cada uma"
