titulo = "E se o dinheiro em papel acabasse no Brasil?"
versao = 1

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o contador '7 bilhões de Pix por mês' girando sobre um celular low-poly (a palavra Pix em texto simples, sem o logotipo oficial); ao lado, o Zé segura uma carteira aberta com notas genéricas low-poly (sem reproduzir as cédulas do real) e olha de uma para o outro."

  [[bloco.frase]]
  fala = "Uns 7 bilhões de Pix por mês."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "7 bilhões de Pix por mês"
  voz = "Uns sete bilhões de Pix por mês."

  [[bloco.frase]]
  fala = "E se o dinheiro em papel acabasse? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Uma pilha de notas e moedas genéricas cresce até o contador 'R$ 350 bi'; na premissa, a pilha fica translúcida com a etiqueta 'só um exercício', e uma ampulheta marca o prazo enquanto o Zé leva um envelope até uma agência bancária genérica (sem marca de banco)."

  [[bloco.frase]]
  fala = "Hoje ainda circulam cerca de R$ 350 bilhões em notas e moedas."
  marcacao = "FATO"
  fontes = ["F2"]
  tela = "R$ 350 bi em notas e moedas"
  voz = "Hoje ainda circulam cerca de trezentos e cinquenta bilhões de reais em notas e moedas."

  [[bloco.frase]]
  fala = "Aqui é só um exercício: vamos supor uma lei que acabe com notas e moedas, com anos para depositar tudo, sem perder valor."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "O Zé paga o pão com o celular e sorri; depois aparece o contador 'quase 1 em cada 10 não usa internet' sobre um celular apagado, e o Zé entrega um cartão genérico a um vizinho low-poly sem rosto definido; por fim, cada compra do Zé solta um recibo digital que vai se empilhando."

  [[bloco.frase]]
  fala = "No começo, para quem já vive no Pix, pouco mudaria."
  marcacao = "PROJEÇÃO"
  fontes = ["F1", "F3"]

  [[bloco.frase]]
  fala = "Mas quase um em cada dez brasileiros com dez anos ou mais não usa internet."
  marcacao = "FATO"
  fontes = ["F4"]
  tela = "quase 1 em cada 10 não usa internet (10 anos ou mais)"

  [[bloco.frase]]
  fala = "Para eles, até comprar pão exigiria cartão ou ajuda de alguém."
  marcacao = "PROJEÇÃO"
  fontes = ["F4", "F5"]

  [[bloco.frase]]
  fala = "No longo prazo, quase todo pagamento deixaria registro: mais difícil sonegar imposto e mais difícil pagar sem ninguém saber."
  marcacao = "PROJEÇÃO"
  fontes = ["F15", "F21"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda com um cofre fechado e o contador 'crime −9%'; prato coral (contra) à direita com uma maquininha e uma lâmpada apagadas; cada prato acende na sua frase; no termômetro, os dois apagam e ela termina equilibrada, com dois prédios genéricos de banco central ao fundo (legendas 'Suécia' e 'Europa', sem logotipos nem bandeiras)."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que menos dinheiro na rua dificulta roubo e sonegação: num estado americano, trocar benefício social em papel por cartão reduziu o crime em cerca de 9%."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F13", "F15"]
  tela = "crime −9% (Missouri, EUA)"
  voz = "Quem defende aponta que menos dinheiro na rua dificulta roubo e sonegação: num estado americano, trocar benefício social em papel por cartão reduziu o crime em cerca de nove por cento."

  [[bloco.frase]]
  fala = "Quem critica aponta que, sem dinheiro vivo, some o plano B: no apagão da Espanha, em 2025, as maquininhas pararam, e muita loja só aceitava dinheiro."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F14"]
  tela = "apagão na Espanha, 2025"
  voz = "Quem critica aponta que, sem dinheiro vivo, some o plano B: no apagão da Espanha, em dois mil e vinte e cinco, as maquininhas pararam, e muita loja só aceitava dinheiro."

  [[bloco.frase]]
  fala = "Não achei pesquisa com economistas, mas bancos centrais como o da Suécia e o Europeu defendem proteger o dinheiro vivo; já o efeito sobre crime e sonegação num país inteiro é incerto."
