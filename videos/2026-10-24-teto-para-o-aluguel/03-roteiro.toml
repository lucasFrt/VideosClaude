# Roteiro: a fonte da verdade do vídeo. Edite este arquivo; o 03-roteiro.md é gerado
# a partir dele pelo scripts/roteiro.py (não edite o .md à mão).
#
# Cada frase tem:
#   fala      o texto do narrador, como deve ser lido no roteiro (pode ter algarismos)
#   marcacao  FATO, PROJEÇÃO, PREMISSA, ARGUMENTO A FAVOR, ARGUMENTO CONTRA, TERMÔMETRO ou BORDÃO
#             (PREMISSA: uma simplificação do cenário, dita no vídeo; vem do 01-ideia.md)
#   fontes    códigos do 02-fontes.md (obrigatório em tudo, menos BORDÃO e PREMISSA)
#   tela      (opcional) número ou texto que aparece na tela; o rodapé de fonte sai das fontes
#   voz       (opcional) a fala escrita como a voz deve ler, com números por extenso
#
# Blocos, nesta ordem: Gancho, Contexto, O que mudaria, A balança, Exemplo real (opcional),
# Encerramento. Duração: 45 a 90 s, mirando em 60 a 75 s (CLAUDE.md, seção 3).

titulo = "E se o aluguel tivesse um teto?"
versao = 3

[[bloco]]
nome = "Gancho"
cena = "Primeiro quadro já com o número +9% enorme sobre uma placa genérica de 'Aluga-se' na janela de um prédio low-poly; o Zé, com uma chave na mão, olha o número crescer."

  [[bloco.frase]]
  fala = "Aluguel anunciado: mais 9% em um ano."
  marcacao = "FATO"
  fontes = ["F1"]
  tela = "+9% em 12 meses (aluguel anunciado, 36 cidades)"
  voz = "Aluguel anunciado: mais nove por cento em um ano."

  [[bloco.frase]]
  fala = "E se o aluguel tivesse um teto? Vamos imaginar."
  marcacao = "BORDÃO"

[[bloco]]
nome = "Contexto"
cena = "Duas barras animadas lado a lado, aluguel anunciado (9,13%) e inflação (4,58%); depois um contrato de papel com o carimbo 'valor livre'. Na premissa, uma linha amarela marcada 'inflação' trava a seta de aumento do aluguel do Zé; quando uma caixa de mudança sai pela porta, a seta do contrato seguinte fica solta."

  [[bloco.frase]]
  fala = "É quase o dobro da inflação."
  marcacao = "FATO"
  fontes = ["F1", "F13"]
  tela = "aluguel anunciado (contratos novos) 9,13% × inflação 4,58%"

  [[bloco.frase]]
  fala = "Hoje, na renovação, o dono pode pedir o preço de mercado."
  marcacao = "FATO"
  fontes = ["F5"]

  [[bloco.frase]]
  fala = "Aqui, vamos supor uma lei federal: para quem já mora, aumento só até a inflação, e nada de trocar de inquilino só para cobrar mais."
  marcacao = "PREMISSA"

  [[bloco.frase]]
  fala = "Com inquilino novo, o preço é livre."
  marcacao = "PREMISSA"

[[bloco]]
nome = "O que mudaria"
cena = "O Zé tranquilo na sala, com a conta do aluguel subindo devagar, colada na linha da inflação. Depois, algumas placas de 'Aluga-se' viram 'Vende-se'. Por fim, uma fila de caixas de mudança diante de poucas placas de 'Aluga-se', com etiquetas de preço maiores."

  [[bloco.frase]]
  fala = "Quem já aluga teria previsibilidade na renovação e menos risco de ter que se mudar."
  marcacao = "PROJEÇÃO"
  fontes = ["F6"]

  [[bloco.frase]]
  fala = "Com o tempo, alguns donos poderiam vender, parar de alugar ou cuidar menos do imóvel."
  marcacao = "PROJEÇÃO"
  fontes = ["F6", "F8", "F9"]

  [[bloco.frase]]
  fala = "Quem procura casa acharia menos opções; quanto, ninguém sabe: os estudos são de fora."
  marcacao = "PROJEÇÃO"
  fontes = ["F6", "F8", "F9"]

[[bloco]]
nome = "A balança"
cena = "Balança 3D equilibrada: prato verde (a favor) à esquerda e coral (contra) à direita; cada prato acende na sua frase com o seu número (quase 20% de um lado; −15% e +5% marcado como estimativa do outro); no termômetro, os dois apagam, aparece o número da revisão de estudos e ela termina equilibrada."

  [[bloco.frase]]
  fala = "Agora, vamos colocar na balança."
  marcacao = "BORDÃO"

  [[bloco.frase]]
  fala = "Quem defende aponta que, em San Francisco, o morador protegido pelo teto teve quase 20% mais chance de ficar no mesmo endereço, e menos inquilinos saíram da cidade."
  marcacao = "ARGUMENTO A FAVOR"
  fontes = ["F6"]
  tela = "quase 20% mais chance de ficar no endereço"
  voz = "Quem defende aponta que, em San Francisco, o morador protegido pelo teto teve quase vinte por cento mais chance de ficar no mesmo endereço, e menos inquilinos saíram da cidade."

  [[bloco.frase]]
  fala = "Quem critica aponta que, em San Francisco, a oferta de aluguel nos prédios com teto caiu 15%, e os autores estimam que quem chegou depois pagou cerca de 5% a mais."
  marcacao = "ARGUMENTO CONTRA"
  fontes = ["F6"]
  tela = "oferta dos prédios com teto −15% · quem chegou depois +5% (estimativa)"
  voz = "Quem critica aponta que, em San Francisco, a oferta de aluguel nos prédios com teto caiu quinze por cento, e os autores estimam que quem chegou depois pagou cerca de cinco por cento a mais."

  [[bloco.frase]]
  fala = "Os estudos mostram as duas coisas, mas a maioria deles vê a oferta cair com o tempo, e pesquisas com economistas nos EUA também; a dúvida é o tamanho, que muda de lugar para lugar."
  marcacao = "TERMÔMETRO"
  fontes = ["F8", "F11", "F7"]
  tela = "12 de 16 estudos: menos oferta de aluguel"
  voz = "Os estudos mostram as duas coisas, mas a maioria deles vê a oferta cair com o tempo, e pesquisas com economistas nos Estados Unidos também; a dúvida é o tamanho, que muda de lugar para lugar."

# Exemplo real cortado por tempo (CLAUDE.md, seção 3): San Francisco já aparece,
# com fonte, nos dois lados da balança. Berlim (F9) e o congelamento de 1942 (F12) estão
# no 02-fontes, com o motivo de não entrarem.

[[bloco]]
nome = "Encerramento"
cena = "O Zé na porta de casa, chave na mão, ombros levantados, olhando para a câmera, esperando a resposta."

  [[bloco.frase]]
  fala = "E aí, você toparia? Me conta nos comentários."
  marcacao = "BORDÃO"
