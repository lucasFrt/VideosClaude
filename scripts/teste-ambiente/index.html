<!doctype html>
<!-- Composição mínima usada pelo scripts/instalar.sh para confirmar que esta máquina
     renderiza GSAP, Three.js, a fonte do tema e áudio. Não é modelo de vídeo do canal. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="componentes/tema.css" />
    <script src="assets/libs/gsap.min.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div
        id="cubo"
        data-composition-id="cubo"
        data-composition-src="cenas/cubo.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <audio id="tom" src="narracao/narracao.mp3" data-start="0" data-volume="1" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
